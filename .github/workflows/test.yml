name: Test Formulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Register as a Homebrew tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/knightmax"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/knightmax/homebrew-knightmax"
      
      - name: Lint formulas
        run: |
          brew audit --formula purectx || true
      
      - name: Install purectx
        run: |
          brew install --build-from-source purectx
      
      - name: Verify installation
        run: |
          which pure
          which pure
          pure --version
