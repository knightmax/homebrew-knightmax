name: Test Formulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Audit formulas
        run: |
          brew audit --new-formula Formula/*.rb
      
      - name: Test purectx formula
        run: |
          # Install the formula from the local directory
          brew install --build-from-source ./Formula/purectx.rb
      
      - name: Verify installation
        run: |
          # Check that the binary exists
          which pure
          
          # Test the binary with --version
          pure --version
